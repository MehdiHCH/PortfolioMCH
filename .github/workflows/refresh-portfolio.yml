name: Build portfolio refresh

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and verify
        run: |
          npm run build
          test -s dist/index.html
          for country in ma us fr au nz hr; do
            test -s "dist/flags/$country.svg"
          done
          for script in dist/assets/*.js; do
            node --check "$script"
          done
      - name: Update published files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --detach publish origin/gh-pages
          cp -a dist/. publish/
          touch publish/.nojekyll
          git -C publish add .
          if ! git -C publish diff --cached --quiet; then
            git -C publish commit -m "Publish career refresh and locally hosted country flags"
            git -C publish push origin HEAD:gh-pages
          fi
